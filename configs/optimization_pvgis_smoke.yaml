# MILP karar motoru konfigürasyonu.
# ÖNEMLİ: "PLACEHOLDER" işaretli değerler varsayımdır; tezde literatür/üretici
# verisiyle doldurulmalı ve duyarlılık analizine (sensitivity) sokulmalıdır.

predictions_npz: results/pvgis_smoke/test_predictions.npz   # train_compare.py çıktısı (PVGIS)
output_dir: results/optimization_pvgis_smoke

timing:
  dt_hours: 1.0             # saatlik adım (PTF ile birebir)

plant:
  capacity_kw: auto         # auto = test verisindeki maksimum AC güç
  grid_limit_ratio: 1.0     # şebeke bağlantı limiti = oran x kapasite

electrolyzer:               # PEM elektrolizör
  p_max_ratio: 0.20         # PLACEHOLDER: elektrolizör gücü = 0.20 x santral kapasitesi
  p_min_ratio: 0.10         # PLACEHOLDER: min yük = 0.10 x p_max (PEM tipik %5-20)
  hhv_kwh_per_kg: 39.4      # H2 üst ısıl değeri
  efficiency_hhv: 0.72      # PLACEHOLDER: sistem verimi (HHV bazlı) -> ~54.7 kWh/kg
  startup_cost_tl: 500.0    # PLACEHOLDER: her başlatma maliyeti (TL)
  var_cost_tl_per_kwh: 0.05 # PLACEHOLDER: bozunma + işletme (TL/kWh elektrolizör enerjisi)

tank:
  max_hours_full_load: 12.0 # tank kapasitesi = 12 saatlik tam yük üretimi
  min_fraction: 0.0
  initial_fraction: 0.20
  terminal_ge_initial: true # gün sonu stok >= gün başı stok (ufuk-sonu boşaltma hilesini engeller)
  max_sale_hours_ratio: 1.5 # satış kapasitesi = 1.5 x tam yük üretim hızı

prices:
  h2_tl_per_kg: 150.0       # PLACEHOLDER: hidrojen satış fiyatı (duyarlılık analizinde taranır)
  epias_csv: data/raw/ptf_2023_synthetic.csv   # EPİAŞ Şeffaflık export'u (csv/xlsx); null -> sentetik PTF
  smf_csv: data/raw/smf_2023_synthetic.csv
  align_mode: calendar      # calendar: PVGIS ve EPİAŞ aynı gerçek tarihler | cycle: senaryo

imbalance:                  # Türkiye kuralı: eksik 1.03 x max(PTF,SMF), fazla 0.97 x min(PTF,SMF)
  short_buy_factor: 1.03    # (2023 için marjı resmi kaynaktan doğrulayın)
  long_sell_factor: 0.97

study:
  window_stride: 1
  recourse_modes: [false, true]   # plana sadık / gerçek zamanlı elektrolizör düzeltmesi
  origin_hours: [0]         # her gün 00:00'da başlayan 24 saatlik pencere (gün öncesi planı)
  h2_price_sweep: [0, 100, 200]
  solver_time_limit_s: 60
