# Karar katmanı için PVGIS (saatlik, çok yıllı) tahmin deneyi.
# Kaggle (gerçek santral telemetrisi) çalışması configs/lstm.yaml'da kalır -> doğrulama.
seed: 42

data:
  csv_path: data/processed/df_pvgis.csv      # scripts/fetch_pvgis.py çıktısı (yerel saat, kW)
  time_col: DATE_TIME
  target: AC_POWER
  freq: 1h
  max_interp_gap: 3
  past_features: [IRRADIATION, AMBIENT_TEMPERATURE, WIND_SPEED]   # rüzgâr hızı: meteorolojik girdi
  future_calendar: [sin_time, cos_time, sin_day, cos_day]         # çok yıllı veri -> mevsim kodu
  future_weather: [IRRADIATION, AMBIENT_TEMPERATURE]
  weather_forecast:
    # lead_time: her tahmin yayını (pencere) kendi hatasını alır; hata ufukla doğrusal büyür.
    # Ortalama düzey (~%19) önceki sabit %20'lik "noisy" ayarıyla karşılaştırılabilir.
    # Değerleri NWP literatürüyle kalibre edin (gün öncesi saatlik GHI hataları).
    mode: lead_time        # none | oracle | noisy (eski) | lead_time
    noise_std: [0.08, 0.30]        # ışınım: çarpımsal std, h=1 -> h=24
    temp_noise_std_c: [0.5, 2.0]   # sıcaklık: toplamsal std (°C), h=1 -> h=24
    rho: 0.8                       # ufuk boyunca AR(1) korelasyon
    noise_scale: 1.0               # tahmin hatası taraması bunu değiştirir (0 = mükemmel hava tahmini)
  lookback: 48            # 2 gün geçmiş
  horizon: 24             # 24 saat ileri
  train_stride: 1
  eval_stride: 1
  split: [0.60, 0.20, 0.20]   # 5 yıl veride test ≈ son 1 yıl (tam mevsim döngüsü)

model:
  hidden_size: 64
  num_layers: 2
  dropout: 0.2

training:
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 100
  patience: 10
  device: auto

tuning:                   # scripts/tune.py (yalnızca validation kullanılır)
  trials_xgboost: 30
  trials_rnn: 20          # LSTM ve GRU için ayrı ayrı (eşit bütçe)
  max_epochs: 30
  patience: 5

output_dir: results/pvgis_run
